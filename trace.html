<script>
(function () {
'use strict';
/* ===== math.js ===== */
/* TRACE (d'après PlotLab v10) — moteur numérique (pur, sans DOM). Testé sous Node, inclus tel quel dans le bundle. */

const isNum = v => typeof v === 'number' && isFinite(v);

/** Parse un nombre saisi en français ou en anglais ("3,33", "1e-3", "−5"). */
function pF(v) {
  if (typeof v === 'number') return v;
  if (v == null) return NaN;
  let s = String(v).trim().replace(/−/g, '-').replace(/[\s ']/g, '');
  if (!s) return NaN;
  if (s.includes(',') && s.includes('.')) s = s.replace(/,/g, '');
  else s = s.replace(',', '.');
  return /^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s) ? parseFloat(s) : NaN;
}

/* ---------- algèbre linéaire ---------- */

function solveLin(A, b) {
  const n = b.length, M = A.map((r, i) => Float64Array.from([...r, b[i]]));
  for (let k = 0; k < n; k++) {
    let p = k;
    for (let i = k + 1; i < n; i++) if (Math.abs(M[i][k]) > Math.abs(M[p][k])) p = i;
    if (Math.abs(M[p][k]) < 1e-300) return null;
    [M[k], M[p]] = [M[p], M[k]];
    for (let i = k + 1; i < n; i++) {
      const f = M[i][k] / M[k][k];
      if (f) for (let j = k; j <= n; j++) M[i][j] -= f * M[k][j];
    }
  }
  const x = new Float64Array(n);
  for (let i = n - 1; i >= 0; i--) {
    let s = M[i][n];
    for (let j = i + 1; j < n; j++) s -= M[i][j] * x[j];
    x[i] = s / M[i][i];
  }
  return x;
}

function invMat(A) {
  const n = A.length, M = A.map((r, i) => {
    const row = new Float64Array(2 * n); row.set(r); row[n + i] = 1; return row;
  });
  for (let k = 0; k < n; k++) {
    let p = k;
    for (let i = k + 1; i < n; i++) if (Math.abs(M[i][k]) > Math.abs(M[p][k])) p = i;
    if (Math.abs(M[p][k]) < 1e-300) return null;
    [M[k], M[p]] = [M[p], M[k]];
    const d = M[k][k];
    for (let j = 0; j < 2 * n; j++) M[k][j] /= d;
    for (let i = 0; i < n; i++) if (i !== k) {
      const f = M[i][k];
      if (f) for (let j = 0; j < 2 * n; j++) M[i][j] -= f * M[k][j];
    }
  }
  return M.map(r => Array.from(r.slice(n)));
}

/**
 * Moindres carrés par QR de Householder (stable même pour des Vandermonde de degré élevé).
 * cols : m colonnes (longueur n) ; w : poids optionnels. Retourne coefficients, (X'WX)^-1 et SS résiduelle pondérée.
 */
function lstsq(cols, y, w) {
  const n = y.length, m = cols.length;
  if (n < m) throw new Error('Pas assez de points (' + n + ') pour ' + m + ' paramètres');
  const A = cols.map(c => Float64Array.from(c)), b = Float64Array.from(y);
  if (w) for (let i = 0; i < n; i++) {
    const s = Math.sqrt(w[i]);
    for (let j = 0; j < m; j++) A[j][i] *= s;
    b[i] *= s;
  }
  for (let k = 0; k < m; k++) {
    let nrm = 0;
    for (let i = k; i < n; i++) nrm = Math.hypot(nrm, A[k][i]);
    if (nrm === 0) throw new Error('Système singulier');
    const alpha = A[k][k] > 0 ? -nrm : nrm;
    const v = new Float64Array(n - k);
    for (let i = 0; i < n - k; i++) v[i] = A[k][k + i];
    v[0] -= alpha;
    let vv = 0; for (let i = 0; i < v.length; i++) vv += v[i] * v[i];
    if (vv > 0) {
      for (let j = k; j < m; j++) {
        let d = 0; for (let i = 0; i < v.length; i++) d += v[i] * A[j][k + i];
        const f = 2 * d / vv;
        for (let i = 0; i < v.length; i++) A[j][k + i] -= f * v[i];
      }
      let d = 0; for (let i = 0; i < v.length; i++) d += v[i] * b[k + i];
      const f = 2 * d / vv;
      for (let i = 0; i < v.length; i++) b[k + i] -= f * v[i];
    }
  }
  let rmax = 0; for (let k = 0; k < m; k++) rmax = Math.max(rmax, Math.abs(A[k][k]));
  for (let k = 0; k < m; k++) if (Math.abs(A[k][k]) < 1e-13 * rmax) throw new Error('Système singulier (données dégénérées)');
  const beta = new Float64Array(m);
  for (let i = m - 1; i >= 0; i--) {
    let s = b[i];
    for (let j = i + 1; j < m; j++) s -= A[j][i] * beta[j];
    beta[i] = s / A[i][i];
  }
  // R^-1 (triangulaire sup.), cov = R^-1 R^-T
  const Ri = Array.from({ length: m }, () => new Float64Array(m));
  for (let c = 0; c < m; c++) {
    for (let i = c; i >= 0; i--) {
      let s = i === c ? 1 : 0;
      for (let j = i + 1; j <= c; j++) s -= A[j][i] * Ri[j][c];
      Ri[i][c] = s / A[i][i];
    }
  }
  const cov = Array.from({ length: m }, () => new Float64Array(m));
  for (let i = 0; i < m; i++) for (let j = 0; j < m; j++) {
    let s = 0; for (let k = Math.max(i, j); k < m; k++) s += Ri[i][k] * Ri[j][k];
    cov[i][j] = s;
  }
  let rss = 0; for (let i = m; i < n; i++) rss += b[i] * b[i];
  return { beta, cov, rss };
}

/* ---------- statistiques / distributions ---------- */

function lgamma(x) {
  const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
  let y = x, t = x + 5.5; t -= (x + 0.5) * Math.log(t);
  let s = 1.000000000190015;
  for (let j = 0; j < 6; j++) s += c[j] / ++y;
  return -t + Math.log(2.5066282746310005 * s / x);
}
function betacf(a, b, x) {
  const TINY = 1e-300; let qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap;
  if (Math.abs(d) < TINY) d = TINY; d = 1 / d; let h = d;
  for (let m = 1; m <= 300; m++) {
    const m2 = 2 * m; let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
    d = 1 + aa * d; if (Math.abs(d) < TINY) d = TINY; c = 1 + aa / c; if (Math.abs(c) < TINY) c = TINY; d = 1 / d; h *= d * c;
    aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
    d = 1 + aa * d; if (Math.abs(d) < TINY) d = TINY; c = 1 + aa / c; if (Math.abs(c) < TINY) c = TINY; d = 1 / d;
    const del = d * c; h *= del; if (Math.abs(del - 1) < 3e-14) break;
  }
  return h;
}
function betai(a, b, x) {
  if (x <= 0) return 0; if (x >= 1) return 1;
  const bt = Math.exp(lgamma(a + b) - lgamma(a) - lgamma(b) + a * Math.log(x) + b * Math.log(1 - x));
  return x < (a + 1) / (a + b + 2) ? bt * betacf(a, b, x) / a : 1 - bt * betacf(b, a, 1 - x) / b;
}
/** CDF de Student. */
function tcdf(t, df) {
  const x = df / (df + t * t), p = 0.5 * betai(df / 2, 0.5, x);
  return t > 0 ? 1 - p : p;
}
/** Quantile bilatéral : t tel que P(|T|<t)=conf. */
function tcrit(df, conf = 0.95) {
  if (!(df > 0)) return NaN;
  const target = 0.5 + conf / 2;
  let lo = 0, hi = 1e3;
  for (let i = 0; i < 100; i++) { const mid = (lo + hi) / 2; if (tcdf(mid, df) < target) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
function pvalT(t, df) { return 2 * (1 - tcdf(Math.abs(t), df)); }

function stats(a) {
  const v = Array.from(a).filter(isNum), n = v.length;
  if (!n) return { n: 0 };
  const mean = v.reduce((s, x) => s + x, 0) / n;
  const sd = n > 1 ? Math.sqrt(v.reduce((s, x) => s + (x - mean) ** 2, 0) / (n - 1)) : NaN;
  const s = v.slice().sort((p, q) => p - q);
  const q = f => { const h = (n - 1) * f, i = Math.floor(h); return s[i] + (h - i) * ((s[i + 1] ?? s[i]) - s[i]); };
  return { n, mean, sd, sem: sd / Math.sqrt(n), min: s[0], max: s[n - 1], median: q(0.5), q1: q(0.25), q3: q(0.75) };
}

/** Formate "valeur ± incertitude" avec 2 chiffres significatifs sur l'incertitude. */
function fmtPM(v, se) {
  if (!isNum(v)) return '—';

/* ---------- import ---------- */

const colRole = (c, i, cols) => {
  if (i === 0) return 'x';
  if (/^(err|error|erreur|sigma|σ|sd|std|écart|ecart|incert|unc|±|delta|δ)/i.test(c.name)) return 'yerr';
  return 'y';

function importParsed(parsed, fname, roles, opts = {}) {
  const cols = parsed.cols; roles = roles || cols.map(colRole);
  const xi = roles.indexOf('x'), base = fname.replace(/\.[^.]+$/, ''), made = [];
  const X = xi >= 0 ? cols[xi] : { name: 'Index', unit: '', values: Float64Array.from(cols[0].values, (_, i) => i) };
  const ys = roles.map((r, i) => (r === 'y' ? i : -1)).filter(i => i >= 0);
  if (!ys.length) throw new Error('Aucune colonne Y sélectionnée');
  ys.forEach(yi => {
    const Y = cols[yi]; let el = null, eh = null, xe = null;
    for (let j = yi + 1; j < cols.length && roles[j] !== 'y' && roles[j] !== 'x'; j++) {
      if (roles[j] === 'yerr') el = eh = cols[j].values; else if (roles[j] === 'yerr-') el = cols[j].values; else if (roles[j] === 'yerr+') eh = cols[j].values; else if (roles[j] === 'xerr') xe = cols[j].values;
    }
    const keep = []; for (let i = 0; i < X.values.length; i++) if (isFinite(X.values[i])) keep.push(i);
    const pick = a => (a ? Float64Array.from(keep, i => Math.abs(a[i])) : null);
    const name = ys.length === 1 ? (opts.name || base) : `${opts.multi ? base + ' — ' : ''}${Y.name}`;
    const d = addDs({ name, x: Float64Array.from(keep, i => X.values[i]), y: Float64Array.from(keep, i => Y.values[i]), yel: pick(el || eh), yeh: pick(eh || el), xe: pick(xe),
      xLabel: opts.xName ?? X.name, xUnit: opts.xUnit ?? X.unit, yLabel: opts.yName ?? Y.name, yUnit: opts.yUnit ?? Y.unit, src: fname, meta: parsed.meta || {} },
    `Importé depuis « ${fname} » (X = ${X.name}, Y = ${Y.name}, ${keep.length} points)`);
    if (el && eh && el !== eh) { d.yel = pick(el); d.yeh = pick(eh); }
    made.push(d); addLog(`Import « ${fname} » → série « ${name} » (${keep.length} points)`);
    if (parsed.warnings?.length) d.hist.push(...parsed.warnings);
  });
  return made;
}

async function parseFile(file) {
  const name = file.name, ext = name.split('.').pop().toLowerCase(), buf = await file.arrayBuffer();
  if (ext === 'plotlab' || ext === 'json') { return { project: JSON.parse(decodeBuffer(buf)), name }; }
  if (ext === 'xlsx' || ext === 'xlsm') {
    const sheets = await readXlsx(buf), out = [];
    for (const sh of sheets) { try { out.push({ sheet: sh.name, parsed: smartTextParse(sheetToTSV(sh)) }); } catch (e) { /* feuille vide */ } }
    if (!out.length) throw new Error('Aucune feuille exploitable dans ' + name);
    return { name, sheets: out };
  }
  if (ext === 'xls') throw new Error('Format .xls (ancien Excel) non supporté : enregistrez en .xlsx ou .csv');
  return { name, sheets: [{ sheet: '', parsed: smartTextParse(decodeBuffer(buf)) }] };
}
async function handleFiles(fileList) {
  const files = [...fileList]; if (!files.length) return;
  const items = [];
  for (const f of files) { try { items.push(await parseFile(f)); } catch (e) { toast(`${f.name} : ${e.message}`, 'err'); } }
  for (const it of items) if (it.project) { loadProjectObject(it.project, it.name); return; }
  if (!items.length) return;
  if (items.length === 1) { openImportModal(items[0]); return; }
  pushUndo(); let n = 0;
  for (const it of items) { try { n += importParsed(it.sheets[0].parsed, it.name, null, { multi: false }).length; } catch (e) { toast(`${it.name} : ${e.message}`, 'err'); } }
  UI.view = null; changed(); toast(`${n} série(s) importée(s) depuis ${items.length} fichiers`);
}

      <p class="muted">${p.cols[0].values.length} lignes · séparateur ${p.sep === '\t' ? 'tabulation' : p.sep === ' ' ? 'espace' : '« ' + esc(p.sep) + ' »'}${p.meta._massMg ? ` · masse détectée : ${p.meta._massMg} mg` : ''}${p.meta._rate ? ` · vitesse : ${p.meta._rate} °C/min` : ''}${p.warnings.length ? '<br>⚠ ' + esc(p.warnings.join(' · ')) : ''}</p>
      <div class="tblwrap"><table class="imp"><thead><tr>${p.cols.map((c, i) => `<th><select data-role="${i}">${ro.map(([v, l]) => `<option value="${v}" ${roles[i] === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <input data-cname="${i}" value="${esc(c.name)}" title="Nom"><input data-cunit="${i}" value="${esc(c.unit)}" placeholder="unité" title="Unité"></th>`).join('')}</tr></thead>

  const ov = $('#ov');

    $('#st-pos').textContent = `x = ${fx(sc.x1.val(m.mx), 6)}   y = ${fx(sc.y1.val(m.my), 6)}` + (sc.y2 ? `   y₂ = ${fx(sc.y2.val(m.my), 6)}` : '');

  const hf = T.map(t => -0.35 + 0.0004 * (t - 20) + 0.06 / (1 + Math.exp(-(t - 75) / 2.5)) - 0.3 * Math.exp(-((t - 130) ** 2) / 18) + 0.9 * Math.exp(-((t - 248) ** 2) / 20) + 0.0004 * g());

  addDs({ name: 'Traction démo', x: e, y: s.map(v => v + 0.15 * g()), xLabel: 'Déformation', xUnit: 'mm/mm', yLabel: 'Contrainte', yUnit: 'MPa', src: 'synthétique' }, 'Données de démonstration synthétiques');
  const th = Float64Array.from({ length: 900 }, (_, i) => 10 + i * 0.05);

/* ===== api.js ===== */
/* TRACE — couche de commandes : permet à un assistant (Friday) d'agir sur le graphe comme l'utilisateur avec les boutons.
 *
 * Principe (voir docs/PROJET-FRIDAY.md) :
 *  - aucun calcul nouveau, sauf la tangente : chaque commande règle les paramètres des panneaux (P), sélectionne la série,
 *    appelle l'action existante (A.xxx) et renvoie ce qui a changé. Les valeurs viennent donc des fonctions de TRACE, testées ;
 *  - tout est annulable : une commande = une seule annulation (Ctrl+Z), même si elle enchaîne plusieurs actions ;
 *  - tout est tracé : chaque commande est inscrite au journal avec la mention « Friday » ;
 *  - en cas d'erreur, rien ne reste modifié ;
 *  - jamais de valeur « par défaut » silencieuse pour une grandeur physique (vitesse de chauffe, masse, ΔH₀) : elle doit être donnée.
 */

const fmtN = v => fmtSig(v, 6);
const resBrief = r => ({ id: r.id, kind: r.kind, title: r.title, series: r.dsName, rows: r.rows.map(q => ({ name: q.k, value: q.s != null ? q.s : fmtPM(q.v, q.se), unit: q.u || '' })), note: r.note || '' });
function seriesBrief(d) {
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (let i = 0; i < d.x.length; i++) if (isFinite(d.x[i]) && isFinite(d.y[i])) { x0 = Math.min(x0, d.x[i]); x1 = Math.max(x1, d.x[i]); y0 = Math.min(y0, d.y[i]); y1 = Math.max(y1, d.y[i]); }
  return { id: d.id, name: d.name, points: d.x.length, x: isFinite(x0) ? [fmtN(x0), fmtN(x1)] : null, y: isFinite(y0) ? [fmtN(y0), fmtN(y1)] : null,
    xLabel: d.xLabel, xUnit: d.xUnit, yLabel: d.yLabel, yUnit: d.yUnit, visible: d.visible, errorBars: !!d.yel, meta: { rate: d.meta?._rate, massMg: d.meta?._massMg }, lastOperations: d.hist.slice(-3) };
}
const nz = (v, what) => { const n = typeof v === 'number' ? v : pF(v); if (!isFinite(n)) throw new Error(`${what} : nombre attendu`); return n; };
const on = (v, what) => (v == null || v === '' ? undefined : nz(v, what));
const oneOf = (v, list, what) => { if (!list.includes(v)) throw new Error(`${what} : « ${v} » inconnu. Valeurs possibles : ${list.join(', ')}`); return v; };
const setP = o => { for (const [k, v] of Object.entries(o)) P[k] = v; };
const blank = v => (v === undefined ? '' : v);

function pickSeries(ref) {
  if (ref == null || ref === '') { const d = active(); if (d) return d; throw new Error('Aucune série : importez des fichiers ou ajoutez des données.'); }
  if (typeof ref === 'number' || /^\d+$/.test(String(ref).trim())) { const d = dsById(+ref); if (d) return d; }
  const q = String(ref).toLowerCase().trim(), exact = S.ds.filter(d => d.name.toLowerCase() === q);
  if (exact.length === 1) return exact[0];
  const part = S.ds.filter(d => d.name.toLowerCase().includes(q));
  if (part.length === 1) return part[0];
  throw new Error(`Série introuvable ou ambiguë : « ${ref} ». Séries existantes : ` + (S.ds.map(d => `${d.id} = « ${d.name} »`).join(' ; ') || 'aucune'));
}
const use = ref => { const d = pickSeries(ref); S.active = d.id; return d; };
const pairArrays = (x, y, what) => {
  if (!Array.isArray(x) || !Array.isArray(y) || x.length !== y.length || !x.length) throw new Error(`${what} : x et y doivent être deux listes de même longueur, non vides`);
  if (x.length > 50000) throw new Error('Trop de points pour cette commande');
  return [Float64Array.from(x, v => nz(v, 'x')), Float64Array.from(y, v => nz(v, 'y'))];
};

/** Ajoute une série (aussi appelée directement par l'application avec des données issues d'une note : le modèle ne les voit pas). */
function addSeriesFrom(o) {
  const [x, y] = pairArrays(o.x, o.y, 'Série');
  const d = addDs({ name: o.name || 'Série ' + (S.ds.length + 1), x, y, xLabel: o.xLabel || '', xUnit: o.xUnit || '', yLabel: o.yLabel || '', yUnit: o.yUnit || '', mode: o.mode || 'both', src: o.source || '', meta: o.meta || {} },
    o.source ? `Ajoutée par Friday depuis ${o.source} (${x.length} points)` : `Ajoutée par Friday (${x.length} points)`);
  return d;
}

  const d = use(a.series), xa = on(a.x_min, 'x_min'), xb = on(a.x_max, 'x_max'), ranged = xa !== undefined && xb !== undefined;
  setP({ pkSens: a.sensitivity_pct ?? 5, pkRange: ranged, pr1: ranged ? xa : '', pr2: ranged ? xb : '' }); A.pkauto();
  return { message: `${(P.pkPos || []).length} pic(s) détecté(s) sur « ${d.name} »`, peaks: (P.pkPos || []).map(p => ({ x: fmtN(p.x), y: fmtN(p.y) })) };
});
def('deconvolve', 'Déconvolution en pics (gaussien, lorentzien, pseudo-Voigt ou auto par AIC) avec incertitudes. Positions données, sinon détection automatique.', tObj({
  series: tSer, positions: { type: 'array', items: { type: 'number' }, description: 'Centres initiaux des pics' }, shape: tE('Forme', SHAPE_KEYS), background: tE('Fond', ['none', 'constant', 'linear']), x_min: tN('X min'), x_max: tN('X max'), residuals: tB('Ajouter les résidus') }),
a => {
  const d = use(a.series), xa = on(a.x_min, 'x_min'), xb = on(a.x_max, 'x_max'), ranged = xa !== undefined && xb !== undefined;
  setP({ pkShape: oneOf(a.shape ?? 'auto', SHAPE_KEYS, 'Forme'), pkBase: { none: '-1', constant: '0', linear: '1' }[a.background ?? 'linear'], pkRange: ranged, pr1: ranged ? xa : '', pr2: ranged ? xb : '', pkNeg: false, pkRes: !!a.residuals });
  if (a.positions?.length) P.pkPos = a.positions.map(x => ({ x: nz(x, 'position'), y: NaN })); else { setP({ pkSens: 5 }); A.pkauto(); }
  A.deconv(); return { message: `Déconvolution de « ${d.name} »` };
});

/* DSC : rien n'est supposé en silence (vitesse, masse, ΔH₀) ; les valeurs réellement utilisées sont renvoyées. */
const dscCommon = (a, d) => {
  const unit = oneOf(a.unit ?? 'Wg', ['Wg', 'mW'], 'Unité du flux'), rate = on(a.rate_k_per_min, 'rate') ?? d.meta?._rate, mass = on(a.mass_mg, 'mass') ?? d.meta?._massMg;
  if (!(rate > 0)) throw new Error('Vitesse de chauffe requise (rate_k_per_min, en K/min) : elle n\'est pas dans les données. Demandez-la à l\'utilisateur ou lisez-la dans la note du cahier.');
  if (unit === 'mW' && !(mass > 0)) throw new Error('Flux en mW : la masse (mass_mg) est requise pour normaliser en W/g.');
  setP({ dscUnit: unit, dscMass: mass ?? '', dscBeta: rate, exoUp: !!a.exo_up }); return { unit, rate, mass: mass ?? null, exoUp: !!a.exo_up };
};
const DSCP = { unit: tE('Unité du flux', ['Wg', 'mW']), rate_k_per_min: tN('Vitesse de chauffe β (K/min) — requise si absente des données'), mass_mg: tN('Masse (mg), requise si flux en mW'), exo_up: tB('Exotherme vers le haut') };
def('dsc_tg', 'DSC : transition vitreuse (Tg onset, milieu, inflexion, endset, ΔCp) sur une fenêtre de température.', tObj({ series: tSer, t_min: tN('Début de fenêtre'), t_max: tN('Fin de fenêtre'), baseline_fraction_pct: tN('% de fenêtre pour les baselines (défaut 20)'), ...DSCP }, ['t_min', 't_max']), a => {
  const d = use(a.series), used = dscCommon(a, d); setP({ tg1: nz(a.t_min, 't_min'), tg2: nz(a.t_max, 't_max'), tgFrac: a.baseline_fraction_pct ?? 20 }); A.dsctg(); return { message: `Tg de « ${d.name} »`, used };
});
def('dsc_peak', 'DSC : pic de fusion ou de cristallisation (T pic, onset, ΔH, largeur) sur une fenêtre.', tObj({ series: tSer, t_min: tN('Début de fenêtre'), t_max: tN('Fin de fenêtre'), baseline: tE('Baseline', ['linear', 'sigmoid']), event: tE('Événement', ['melt', 'cold', 'cryst', 'other']), ...DSCP }, ['t_min', 't_max']), a => {
  const d = use(a.series), used = dscCommon(a, d); setP({ pk1: nz(a.t_min, 't_min'), pk2: nz(a.t_max, 't_max'), dscBl: oneOf(a.baseline ?? 'linear', ['linear', 'sigmoid'], 'Baseline'), dscEvt: oneOf(a.event ?? 'melt', ['melt', 'cold', 'cryst', 'other'], 'Événement') });
  A.dscpeak(); return { message: `Pic DSC de « ${d.name} »`, used };
});
def('dsc_auto', 'DSC : détection et analyse automatiques des événements (à vérifier ensuite).', tObj({ series: tSer, ...DSCP }), a => { const d = use(a.series), used = dscCommon(a, d); A.dscauto(); return { message: `Événements DSC de « ${d.name} »`, used }; });
def('dsc_event_type', 'DSC : corrige le type d\'un événement déjà analysé (pour le calcul de Xc).', tObj({ result_id: tN('Numéro du résultat'), event: tE('Événement', ['melt', 'cold', 'cryst', 'other']) }, ['result_id', 'event']), a => {
  const r = S.results.find(q => q.id === +a.result_id && q.kind === 'dsc-peak'); if (!r) throw new Error('Résultat DSC introuvable'); r.evt = oneOf(a.event, ['melt', 'cold', 'cryst', 'other'], 'Événement'); return { message: `Événement du résultat ${r.id} : ${a.event}` };
});
def('dsc_crystallinity', 'DSC : taux de cristallinité Xc = (ΔHm − ΔHcc) / (ΔH₀·(1 − w)) × 100, à partir des pics déjà analysés. Le polymère ou ΔH₀ doit être donné (valeur de la littérature : la source est à citer).', tObj({
  series: tSer, polymer: tS('Polymère de la liste de TRACE (PLA, PET, PP, …)'), dh0_j_per_g: tN('ΔH₀ du polymère 100 % cristallin (J/g)'), filler_fraction: tN('Fraction massique de charge w (défaut 0)') }), a => {
  const d = use(a.series), dh0 = on(a.dh0_j_per_g, 'dh0') ?? (a.polymer ? DH0[a.polymer] : undefined);
  if (!(dh0 > 0)) throw new Error('ΔH₀ requis : indiquez le polymère (' + Object.keys(DH0).join(', ') + ') ou la valeur dh0_j_per_g.');
  setP({ dh0Preset: a.polymer && DH0[a.polymer] ? a.polymer : P.dh0Preset, dh0: dh0, dscW: a.filler_fraction ?? 0 }); A.dscxc(); return { message: `Cristallinité de « ${d.name} »`, used: { dh0, filler: a.filler_fraction ?? 0 } };
});

def('annotate', 'Annotations : point (x, y facultatif = valeur de la série en x), ligne verticale, ligne horizontale, région surlignée.', tObj({
  type: tE('Type', ['point', 'vline', 'hline', 'region']), series: tSer, x: tN('x'), y: tN('y'), text: tS('Texte (indices T_{g} possibles)'), x_min: tN('Début de région'), x_max: tN('Fin de région'), color: tS('Couleur #rrggbb (région)') }, ['type']), a => {
  const t = oneOf(a.type, ['point', 'vline', 'hline', 'region'], 'Type'), text = a.text || '';
  if (a.color !== undefined && !/^#[0-9a-f]{6}$/i.test(a.color)) throw new Error('Couleur : format #rrggbb attendu');
  if (t === 'vline') S.annots.push({ id: S.nextId++, type: 'vline', x: nz(a.x, 'x'), text });
  else if (t === 'hline') S.annots.push({ id: S.nextId++, type: 'hline', y: nz(a.y, 'y'), text });
  else if (t === 'region') { const p = nz(a.x_min, 'x_min'), q = nz(a.x_max, 'x_max'); S.regions.push({ id: S.nextId++, x1: Math.min(p, q), x2: Math.max(p, q), color: a.color || '#0072B2' }); }
  else { const x = nz(a.x, 'x'); let y = on(a.y, 'y'); if (y === undefined) { const d = pickSeries(a.series), c = cleanSorted(d); if (!(x >= c.x[0] && x <= c.x[c.x.length - 1])) throw new Error('x hors des données : donnez aussi y'); y = yAtX(c.x, c.y, x); }
    S.annots.push({ id: S.nextId++, type: 'point', x, y, text: text || `(${fx(x, 4)} ; ${fx(y, 4)})` }); }
  return { message: 'Annotation ajoutée' };
});
def('clear_annotations', 'Supprime toutes les annotations et régions.', tObj({}), () => { S.annots = []; S.regions = []; return { message: 'Annotations supprimées' }; });

def('tangent', 'Trace la tangente en x0 : régression polynomiale locale (degré 2) sur la fenêtre [x0 − h ; x0 + h] ; renvoie pente et valeur avec leurs écarts-types, ajoute la droite et un repère.', tObj({
  series: tSer, x: tN('Abscisse x0 de la tangente'), half_width: tN('Demi-fenêtre h, en unités de x (défaut : 2 % de l\'étendue de x)'), degree: tE('Degré local', ['1', '2']), length: tN('Demi-longueur du trait tracé (défaut 4·h)') }, ['x']), a => {
  const d = use(a.series), c = cleanSorted(d), x0 = nz(a.x, 'x'), t = tangentAt(c.x, c.y, x0, { halfWidth: on(a.half_width, 'half_width'), deg: a.degree ? +a.degree : 2 });
  const L = on(a.length, 'length') ?? 4 * t.halfWidth, b = t.y0 - t.slope * x0, u = d.yUnit && d.xUnit ? `${d.yUnit}/${d.xUnit}` : '';
  addOverlay({ name: `Tangente x = ${fx(x0, 5)}`, x: [x0 - L, x0 + L], y: [t.y0 - t.slope * L, t.y0 + t.slope * L], color: ANALYSIS_COLOR, dash: 'dash', width: 1.6, kind: 'tan', axX: d.axX, axY: d.axY, dsId: d.id });
  S.annots.push({ id: S.nextId++, type: 'point', x: x0, y: t.y0, text: `pente = ${fx(t.slope, 4)}${u ? ' ' + u : ''}`, color: ANALYSIS_COLOR, kind: 'tan', dsId: d.id });
  addResult('tangent', `Tangente en x = ${fx(x0, 5)}`, [{ k: 'x₀', v: x0, u: d.xUnit }, { k: 'y(x₀) ajusté', v: t.y0, se: t.seY0, u: d.yUnit }, { k: 'Pente', v: t.slope, se: t.seSlope, u }, { k: 'Ordonnée à l\'origine (droite)', v: b, u: d.yUnit },
    { k: 'Fenêtre', s: `x₀ ± ${fx(t.halfWidth, 4)} (${t.n} points, degré ${t.deg})` }, { k: 'R² local', v: t.r2 }], 'Régression polynomiale locale : la pente dépend de la fenêtre. Faites varier la demi-fenêtre pour juger la stabilité.', d.name);
  return { message: `Tangente de « ${d.name} » en x = ${fx(x0, 5)}` };
});
def('measure', 'Δx, Δy et pente entre deux abscisses (valeurs interpolées sur la série).', tObj({ series: tSer, x1: tN('Premier x'), x2: tN('Second x') }, ['x1', 'x2']), a => {
  const d = use(a.series), c = cleanSorted(d), p = nz(a.x1, 'x1'), q = nz(a.x2, 'x2'); for (const v of [p, q]) if (!(v >= c.x[0] && v <= c.x[c.x.length - 1])) throw new Error(`x = ${v} hors des données`);
  const y1 = yAtX(c.x, c.y, p), y2 = yAtX(c.x, c.y, q), u = d.yUnit && d.xUnit ? `${d.yUnit}/${d.xUnit}` : '';
  addResult('measure', `Mesure entre x = ${fx(p, 5)} et x = ${fx(q, 5)}`, [{ k: 'Δx', v: q - p, u: d.xUnit }, { k: 'Δy', v: y2 - y1, u: d.yUnit }, { k: 'Pente Δy/Δx', v: (y2 - y1) / (q - p), u }, { k: 'y(x1)', v: y1, u: d.yUnit }, { k: 'y(x2)', v: y2, u: d.yUnit }], 'Valeurs interpolées linéairement sur les données.', d.name);
  return { message: 'Mesure effectuée' };
});

def('value_at', 'Valeur de la série en x (interpolation linéaire). Ne modifie rien.', tObj({ series: tSer, x: tN('x') }, ['x']), a => {
  const d = pickSeries(a.series), c = cleanSorted(d), x = nz(a.x, 'x'); if (!(x >= c.x[0] && x <= c.x[c.x.length - 1])) throw new Error('x hors des données');
  return { series: d.name, x: fmtN(x), y: fmtN(yAtX(c.x, c.y, x)), unit: d.yUnit, method: 'interpolation linéaire' };
});
def('stats', 'Statistiques d\'une série sur une plage X : n, min, max, moyenne, écart-type, aire (trapèzes), positions du min et du max. Ne modifie rien.', tObj({ series: tSer, x_min: tN('X min'), x_max: tN('X max') }), a => {
  const d = pickSeries(a.series), c = cleanSorted(d), lo = on(a.x_min, 'x_min') ?? -Infinity, hi = on(a.x_max, 'x_max') ?? Infinity, s = subRange(c.x, c.y, lo, hi), n = s.x.length; if (n < 2) throw new Error('Moins de 2 points dans la plage');
  let mn = Infinity, mx = -Infinity, imn = 0, imx = 0, sum = 0; for (let i = 0; i < n; i++) { sum += s.y[i]; if (s.y[i] < mn) { mn = s.y[i]; imn = i; } if (s.y[i] > mx) { mx = s.y[i]; imx = i; } }
  const mean = sum / n; let ss = 0; for (let i = 0; i < n; i++) ss += (s.y[i] - mean) ** 2;
  return { series: d.name, n, min: fmtN(mn), atMin: fmtN(s.x[imn]), max: fmtN(mx), atMax: fmtN(s.x[imx]), mean: fmtN(mean), stdDev: fmtN(n > 1 ? Math.sqrt(ss / (n - 1)) : NaN), areaTrapezes: fmtN(trapz(s.x, s.y)), xUnit: d.xUnit, yUnit: d.yUnit };
});
def('calc', 'Évalue une expression numérique (nombres, + − * / ^, exp, ln, log10, sqrt, sin, cos, tanh, abs, pi, e). À utiliser pour tout calcul : ne jamais calculer de tête. Ne modifie rien.', tObj({ expression: tS('Expression, ex. 2*pi*0.35^2') }, ['expression']), a => {
  const v = compileExpr(String(a.expression), [], false).fn(); if (!isFinite(v)) throw new Error('Résultat non fini'); return { expression: a.expression, value: fmtN(v) };
});

def('undo', 'Annule la dernière modification (comme Ctrl+Z).', tObj({}), () => { if (!UNDO.length) throw new Error('Rien à annuler'); undo(); return { message: 'Annulé' }; });
def('redo', 'Rétablit la modification annulée.', tObj({}), () => { if (!REDO.length) throw new Error('Rien à rétablir'); redo(); return { message: 'Rétabli' }; });

/** Exécute une commande : atomique (en cas d'erreur, rien ne change), une seule annulation, journal « Friday ». */
function exec(op, args = {}) {
  const cmd = CMD[op];
  if (!cmd) return { ok: false, error: `Commande inconnue : ${op}. Commandes : ${Object.keys(CMD).join(', ')}` };
  if (ro.has(op)) { try { return { ok: true, ...cmd.run(args || {}) }; } catch (e) { return { ok: false, error: e.message }; } }
  const before = { ds: new Set(S.ds.map(d => d.id)), res: S.results.length, ann: S.annots.length, reg: S.regions.length, ov: S.overlays.length };
  const pre = snap(), base = UNDO.slice(), redo0 = REDO.slice(), active0 = S.active;
  try {
    const out = cmd.run(args || {}) || {};
    const keep = op === 'undo' || op === 'redo';
    if (!keep) { UNDO.length = 0; UNDO.push(...base, pre); while (UNDO.length > MAXUNDO) UNDO.shift(); REDO.length = 0; addLog(`[Friday] ${op} ${JSON.stringify(args).slice(0, 240)}`); }
    changed();
    toast('Friday · ' + (out.message || op));
    return { ok: true, ...out, newSeries: S.ds.filter(d => !before.ds.has(d.id)).map(seriesBrief), newResults: S.results.slice(before.res).map(resBrief),
      addedAnnotations: Math.max(0, S.annots.length - before.ann), addedRegions: Math.max(0, S.regions.length - before.reg), addedCurves: S.overlays.slice(before.ov).map(o => o.name), activeSeries: S.active, canUndo: UNDO.length > 0 };
  } catch (e) {
    UNDO.length = 0; UNDO.push(...base); REDO.length = 0; REDO.push(...redo0); restore(pre); S.active = S.ds.find(d => d.id === active0) ? active0 : S.ds[0]?.id ?? null; changed();
    return { ok: false, error: e.message };
  }
}

window.TRACE = {
  version: 1,
  exec,
  /** Habillage fourni par Jarvis (couleurs de Friday) : sans effet sur les données ni sur les exports. */
  setSkin(skin) { document.documentElement.dataset.skin = skin; UI.theme = skin === 'friday' ? 'dark' : UI.theme; applyTheme(); paint(); },
  describe: () => exec('describe'),
  /** Outils au format « fonctions » des API de modèles : le même texte décrit chaque commande. */
  spec: () => Object.entries(CMD).map(([name, c]) => ({ type: 'function', function: { name, description: c.desc, parameters: c.schema } })),
  /** Ajout direct de données lues par l'application (une note du cahier) : les nombres ne passent jamais par le modèle. */
  addSeries(o) {
    const pre = snap(), base = UNDO.slice();
    try { const d = addSeriesFrom(o); UNDO.length = 0; UNDO.push(...base, pre); REDO.length = 0; addLog(`[Friday] Série « ${d.name} » ajoutée depuis ${o.source || 'une note'} (${d.x.length} points)`); UI.view = null; changed(); return { ok: true, series: seriesBrief(d) }; }
    catch (e) { restore(pre); return { ok: false, error: e.message }; }
  },
};

})();
